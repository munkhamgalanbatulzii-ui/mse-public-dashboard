name: Update MSE dashboard and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 10:00 UTC = 18:00 Ulaanbaatar, Mon-Fri
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch latest MSE data
        id: scrape
        continue-on-error: true
        run: python scrape_mse.py

      - name: Persist latest successful data
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "mse-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Update MSE market data"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
