name: Update MSE market data

on:
  push:
    branches: [main]
    paths:
      - 'scrape_mse.py'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  schedule:
    # 10:00 UTC = 18:00 Ulaanbaatar, Mon-Fri
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mse-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install scraper
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch latest MSE data
        run: python scrape_mse.py

      - name: Save latest data
        run: |
          git config user.name "mse-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Update MSE market data"
          git push
