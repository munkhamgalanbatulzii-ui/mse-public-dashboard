name: Discover MSE bank and NBFI reports

on:
  push:
    branches: [main]
    paths:
      - 'scan_mse_reports.py'
      - '.github/workflows/issuer-reports.yml'
  schedule:
    # Hourly including weekends; the publication date/time is unknown.
    # Offset from minute 00 to reduce scheduled-run congestion.
    - cron: '31 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mse-issuer-reports
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium --with-deps
      - name: Find financial and activity reports on MSE
        run: python scan_mse_reports.py
      - name: Save provenance index only (concurrent-safe)
        run: |
          git config user.name "mse-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          cp financial/data/issuer_report_watch.json /tmp/mse_issuer_report_scan.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/mse_issuer_report_scan.json financial/data/issuer_report_watch.json
            git add financial/data/issuer_report_watch.json
            if git diff --cached --quiet; then
              echo "No new report index changes"
              exit 0
            fi
            git commit -m "Scan MSE issuer report availability"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update; retrying safely"
            sleep 2
          done
          exit 1
