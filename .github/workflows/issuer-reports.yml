name: Discover MSE bank and NBFI reports

on:
  push:
    branches: [main]
    paths:
      - 'scan_mse_reports.py'
      - '.github/workflows/issuer-reports.yml'
  schedule:
    # Weekdays at 18:30 Ulaanbaatar (UTC+8)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mse-issuer-reports
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install chromium --with-deps
      - name: Find financial and activity reports on MSE
        run: python scan_mse_reports.py
      - name: Save provenance index only
        run: |
          git config user.name "mse-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add financial/data/issuer_report_watch.json
          git diff --cached --quiet || git commit -m "Scan MSE issuer report availability"
          git pull --rebase origin main
          git push origin HEAD:main
